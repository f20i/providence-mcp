[project]
name = "providence-mcp"
version = "0.1.0"
description = "Providence MCP: MCP Gateway for Providence"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.1",
    "pydantic==2.12.5",
    "python-dotenv>=1.1.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
]

[tool.poetry.requires-plugins]
poethepoet = ">=0.41.0"

[tool.poe.tasks.dev]
cmd = "dotenv -f .env run python -m src.main"

[tool.poe.tasks.start]
cmd = "python -m src.main"